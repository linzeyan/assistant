[project]
name = "assistant"
version = "0.1.0"
description = "Local-first AI assistant backend for macOS Apple Silicon (omlx model layer + async agent)."
requires-python = ">=3.11"
# Upper bounds are deliberate: hermes-agent's litellm supply-chain incident is the
# cautionary tale for unbounded deps. Pin majors, bump intentionally.
#
# These bounds are the ONLY thing standing between an upstream release and a user's
# machine: every install path (`make install`, the .app's bootstrap.sh, the in-app managed
# -tools installer) resolves fresh against them. uv.lock is NOT an install input — nothing
# reads it. It exists so Dependabot / GitHub's dependency graph can see the ~160 transitive
# packages that pyproject alone doesn't name, and `make deps-check` keeps it honest.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-telegram-bot>=21,<22",
    # hub 1.x is required by mflux>=0.18 (and accepted by the whole mlx stack); we only use
    # the stable snapshot_download, unaffected by the 0.x→1.x major. Cap the major per policy.
    "huggingface-hub>=0.20,<2.0",  # model downloads (lightweight; mlx tools also use it)
    "tomli-w>=1.0,<2.0",  # write the GUI-editable config back to config.toml
]

[project.optional-dependencies]
# Each MLX backend is a heavy, Apple-Silicon-only opt-in: the matching feature
# reports UNAVAILABLE (never crashes) when its extra isn't installed.
mlx = ["mlx-lm>=0.31,<1.0"]            # native LLM inference backend (>=0.31: batch lane API, N104)
images = ["mflux>=0.18,<1.0"]          # FLUX image generation + Qwen-Image-Edit
embeddings = ["mlx-embeddings>=0.0.1,<1.0"]  # semantic memory search
vlm = ["mlx-vlm>=0.1,<1.0"]            # vision-language (read images)
audio = ["mlx-audio>=0.2,<1.0"]        # speech-to-text + text-to-speech
video = [
    "mlx-video @ git+https://github.com/Blaizzy/mlx-video.git",  # Blaizzy's MLX gen lib; the same-named PyPI package is an unrelated I/O lib
    # mlx-video pulls librosa -> numba -> llvmlite. Under the full [all] set (with mlx-audio
    # also wanting librosa) uv backtracks to the ancient numba 0.53.1, whose llvmlite 0.36
    # can't build on Python 3.12 and breaks the managed-venv install. Floor numba to a build
    # that ships 3.12 wheels so the resolver stays on modern llvmlite (N33 deploy fix).
    "numba>=0.59",
]
# Everything the app manages, in one install (recursive extra). `make install`.
all = ["assistant[mlx,images,embeddings,vlm,audio,video]"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.0,<2.0",
]

[project.scripts]
assistant-server = "assistant.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The [video] extra pins Blaizzy's mlx-video by git URL (the PyPI name is an unrelated
# I/O lib); hatchling rejects direct references in dependencies unless this is opted in.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["assistant"]
# Ship the bundled seed skills. They live at the repo root (sibling of the `assistant`
# package), so `packages` alone leaves them out of the wheel and the installed backend finds
# an empty shelf (main.py `_BUNDLED_SKILLS_DIR` -> site-packages/skills). force-include lands
# them at the wheel's top level -> site-packages/skills/, exactly where that path resolves.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
