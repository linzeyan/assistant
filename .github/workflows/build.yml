name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Backend tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up venv + dev deps
        run: make setup
      - name: Run tests
        run: make test

  # Guards the two things `make setup` can't see: uv.lock silently rotting away from
  # pyproject (it drifted generations before anyone noticed), and the user-facing
  # `wheel[all]` resolve breaking on an upstream release.
  #
  # The matrix spans requires-python's floor to the newest interpreter it admits, because
  # Settings > Backend runtime takes a free-text version — every one of these is a venv a
  # user can actually ask bootstrap.sh for. If the top of the range goes red, the fix is
  # either the offending dep or an upper bound on requires-python; it is not "ignore it".
  deps:
    name: Dependency resolution (py${{ matrix.python }})
    runs-on: macos-14
    strategy:
      fail-fast: false # one bad interpreter shouldn't hide the state of the others
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check lock + resolve the shipped [all] install
        run: make deps-check PYVER=${{ matrix.python }}

  package:
    name: Package macOS app
    runs-on: macos-14
    # A broken user-facing resolve must not produce a release artifact.
    needs: [test, deps]
    permissions:
      contents: write # needed by the release step on tag pushes
    env:
      # Developer ID signing + notarization only on release tags. PR / main builds stay
      # ad-hoc and need no secrets, so fork PRs still build.
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5 # app-package builds the backend wheel via `uv build`
      - name: Swift version
        run: swift --version

      # Import the Developer ID Application cert into a throwaway keychain so codesign can
      # find it non-interactively. The signing identity is read back from the keychain and
      # passed to package.sh via CODESIGN_IDENTITY (which then enables hardened runtime).
      - name: Import Developer ID certificate
        if: env.RELEASE == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          # Put our keychain on the search list so codesign / find-identity see it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY" || { echo "No Developer ID Application identity in the .p12"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

      - name: Build + bundle + sign
        env:
          # Empty on non-release builds -> package.sh falls back to an ad-hoc signature.
          CODESIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
        run: make app-package

      - name: Notarize + staple
        if: env.RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent Assistant.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --password "$APP_SPECIFIC_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple Assistant.app
          xcrun stapler validate Assistant.app
          rm -f notarize.zip

      - name: Zip app
        run: cd dist && ditto -c -k --keepParent Assistant.app Assistant.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Assistant-macos-arm64
          path: dist/Assistant.app.zip

      - name: Release (on tag)
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Assistant.app.zip

      - name: Clean up keychain
        if: ${{ always() && env.RELEASE == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
